name: Update stock data

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"   # كل 15 دقيقة أثناء جلسة السوق الأمريكي (UTC) — أسعار فقط
    - cron: "30 22 * * 1-5"        # مرة بعد الإغلاق — أسعار + توصيات البنوك
  workflow_dispatch:                # تشغيل يدوي من تبويب Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install yfinance pandas

      - name: Fetch data
        run: |
          ARGS=""
          if [ "${{ github.event.schedule }}" = "30 22 * * 1-5" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--recs"
          fi
          python scripts/update_data.py $ARGS

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
