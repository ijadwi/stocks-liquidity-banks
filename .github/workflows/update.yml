name: update-data
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"   # كل 15 دقيقة أثناء ساعات السوق الأمريكي (UTC)
    - cron: "30 22 * * 1-5"        # بعد الإغلاق
  workflow_dispatch: {}            # زر «Run workflow» للتشغيل اليدوي
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "update data" && git push)
